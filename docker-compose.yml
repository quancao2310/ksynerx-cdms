services:
  vietful-inventory-service:
    build:
      context: ./vietful-inventory-service
    container_name: vietful_inventory_service_django
    ports:
      - "8000:8000"
    volumes:
      - ./vietful-inventory-service:/app
    depends_on:
      - postgres-vietful
    env_file:
      - ./vietful-inventory-service/.env
    networks:
      - vietful_network
      - web_network

  postgres-vietful:
    image: postgres:18-alpine
    container_name: postgres_vietful
    volumes:
      - postgres_vietful_data:/var/lib/postgresql
    env_file:
      - ./.envs/.postgres-vietful.env
    ports:
      - "5432:5432"
    restart: always
    networks:
      - vietful_network

  cdms-web:
    build:
      context: ./cdms
    container_name: cdms_web
    ports:
      - "8001:8001"
    volumes:
      - ./cdms:/app
      - cdms_media:/app/media
    depends_on:
      - postgres-cdms
    env_file:
      - ./cdms/.env
    networks:
      - cdms_network
      - web_network

  cdms-poller:
    build:
      context: ./cdms
    container_name: cdms_poller
    command: python manage.py run_poller
    volumes:
      - ./cdms:/app
    depends_on:
      - postgres-cdms
      - vietful-inventory-service
    env_file:
      - ./cdms/.env
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - cdms_network
      - web_network

  postgres-cdms:
    image: postgres:18-alpine
    container_name: postgres_cdms
    volumes:
      - postgres_cdms_data:/var/lib/postgresql
    env_file:
      - ./.envs/.postgres-cdms.env
    ports:
      - "5433:5432"
    restart: always
    networks:
      - cdms_network

volumes:
  postgres_vietful_data:
  postgres_cdms_data:
  cdms_media:

networks:
  vietful_network:
    driver: bridge
  cdms_network:
    driver: bridge
  web_network:
    driver: bridge
